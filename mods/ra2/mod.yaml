Metadata:
	Title: mod-title
	Version: nukehour-storage-v1
	WindowTitle: mod-windowtitle

	DisplayVersion: NUKE HOUR Android 0.0.31 (Build 31)
	Compatibility: nukehour-core-sha256-97fdb49d79e614154e72d893456dd7f9b6db749eb4a28cd1f989e7b2206c04d4
ModCredits:
	ModTabTitle: NUKE HOUR
	ModCreditsFile: ra2|AUTHORS

PackageFormats: Mix, AudioBag

FileSystem: ContentInstallerFileSystem
	SystemPackages:
		^EngineDir
		$ra2: ra2
		^EngineDir|mods/common: common
		~^SupportDir|Content/ra2: content
	ContentInstallerMod: ra2-content
	ContentPackages:
		# Original RA2 campaign sources remain optional user-owned content.
		# RetailCampaignInstaller converts them into private user-cache missions.
		~maps01.mix: retailcampaign01
		~maps02.mix: retailcampaign02
		~mapsmd03.mix: retailcampaignmd03
		# The retail movie discs are optional. When supplied by the player,
		# campaign actions can show their original radar-window cinematics.
		~movies01.mix: retailmovies01
		~movies02.mix: retailmovies02
		~movmd03.mix: retailmoviesmd03
		# Multiplayer maps remain player-supplied retail data. They are mounted
		# only so RetailMapInstaller can convert them into user-storage .oramap files.
		~multimd.mix: retailmapsmd
		~multi.mix: retailmaps
		# Yuri's Revenge (optional - mounted only when the player provides YR assets).
		# Mounted before the RA2 packages so original RA2 artwork wins for shared files.
		~langmd.mix: langmd
		~ra2md.mix: ra2md
		~thememd.mix
		~langmd|audiomd.mix: audiomd
		~langmd|cameomd.mix: cameomd
		~ra2md|cachemd.mix
		~ra2md|conqmd.mix: conqmd
		~ra2md|des.mix
		~ra2md|desert.mix
		~ra2md|genermd.mix
		~ra2md|isodesmd.mix
		~ra2md|isodes.mix
		~ra2md|isogenmd.mix
		~ra2md|isolunmd.mix
		~ra2md|isolun.mix
		~ra2md|isosnomd.mix
		~ra2md|isotemmd.mix
		~ra2md|isoubnmd.mix
		~ra2md|isoubn.mix
		~ra2md|isourbmd.mix
		~ra2md|loadmd.mix
		~ra2md|localmd.mix: localmd
		~ra2md|lun.mix
		~ra2md|lunar.mix
		~ra2md|ntrlmd.mix
		~ra2md|snowmd.mix
		~ra2md|ubn.mix
		~ra2md|urbann.mix
		~audiomd|audio.bag

		# Red Alert 2
		ra2.mix
		language.mix
		audio.mix
		cache.mix
		cameo.mix
		conquer.mix: conquer
		generic.mix
		isogen.mix
		isosnow.mix
		isotemp.mix
		isourb.mix
		load.mix
		local.mix
		neutral.mix
		sidec01.mix
		sidec02.mix
		sno.mix
		snow.mix
		tem.mix
		temperat.mix
		urb.mix
		urban.mix
		audio.bag
		~theme.mix
		# Below are mod-provided (system) packages that need to be loaded after the content packages so they can override content assets.
		~ra2|bits
		~ra2|bits/cameos
		~ra2|bits/structures
		~ra2|bits/animations
		~ra2|bits/projectiles
		ra2|uibits

