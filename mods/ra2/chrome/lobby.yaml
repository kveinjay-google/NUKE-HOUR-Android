StretchBackground@SERVER_LOBBY:
	Logic: LobbyLogic
		ChatTemplates:
			Chat: CHAT_LINE_TEMPLATE
			Join: SYSTEM_LINE_TEMPLATE
			Leave: SYSTEM_LINE_TEMPLATE
			System: SYSTEM_LINE_TEMPLATE
			Mission: CHAT_LINE_TEMPLATE
			Feedback: TRANSIENT_LINE_TEMPLATE
	Background: cc-mp-lobby-background
	PreserveAspectRatio: False
	ClickThrough: False
	CompactPhoneSurface: true
	Width: WINDOW_WIDTH
	Height: WINDOW_HEIGHT
	Children:
		MacBrandTitle@MAC_BRAND_TITLE:
			X: PARENT_WIDTH * 15 / 100
			Y: 0
			Width: PARENT_WIDTH * 70 / 100
			Height: PARENT_HEIGHT * 4 / 100
			Font: Bold
			Align: Center
			VAlign: Middle
			TextColor: F2E4CD
			Shadow: true
		Container@LOBBY_CONTENT:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			Children:
				Label@SERVER_NAME:
					Y: 16
					Align: Center
					Width: PARENT_WIDTH
					Height: 25
					Font: Bold
				Container@MAP_PREVIEW_ROOT:
					X: PARENT_WIDTH - 20 - WIDTH
					Y: 67
					Width: 174
					Height: 250
				DropDownButton@SLOTS_DROPDOWNBUTTON:
					Background: cc-mp-control
					X: 20
					Y: 291
					Width: 185
					Height: 25
					Font: Bold
					Text: dropdownbutton-server-lobby-slots
				Button@RESET_OPTIONS_BUTTON:
					Background: cc-mp-control
					X: 20
					Y: 291
					Width: 185
					Height: 25
					Font: Bold
					Text: button-server-lobby-reset-options
				Container@SKIRMISH_TABS:
					X: 695 - WIDTH
					Width: 486
					Visible: False
					Children:
						Button@PLAYERS_TAB:
							Y: 285
							Width: 162
							Height: 31
							Font: Bold
							Text: button-skirmish-tabs-players-tab
						Button@OPTIONS_TAB:
							X: 162
							Y: 285
							Width: 162
							Height: 31
							Font: Bold
							Text: button-skirmish-tabs-options-tab
						Button@MUSIC_TAB:
							X: 2 * 162
							Y: 285
							Width: 162
							Height: 31
							Font: Bold
							Text: label-music-title
				Container@MULTIPLAYER_TABS:
					X: 695 - WIDTH
					Width: 486
					Visible: False
					Children:
						Button@PLAYERS_TAB:
							Y: 285
							Width: 162
							Height: 31
							Font: Bold
							Text: button-multiplayer-tabs-players-tab
						Button@OPTIONS_TAB:
							X: 162
							Y: 285
							Width: 162
							Height: 31
							Font: Bold
							Text: button-multiplayer-tabs-options-tab
						Button@MUSIC_TAB:
							X: 324
							Y: 285
							Width: 162
							Height: 31
							Font: Bold
							Text: label-music-title
				Container@TOP_PANELS_ROOT:
					X: 20
					Y: 67
					Width: 675
					Height: 219
				Button@CHANGEMAP_BUTTON:
					Background: cc-mp-control
					X: PARENT_WIDTH - WIDTH - 20
					Y: 291
					Width: 174
					Height: 25
					Text: button-server-lobby-changemap
					Font: Bold
				Container@LOBBYCHAT:
					X: 20
					Y: PARENT_HEIGHT - HEIGHT - 20
					Width: PARENT_WIDTH - 40
					Height: 259
					Children:
						ScrollPanel@CHAT_DISPLAY:
							Width: PARENT_WIDTH
							Height: PARENT_HEIGHT - 30
							ScrollBar: Hidden
							ScrollbarWidth: 0
							EnableContentDragging: true
							TopBottomSpacing: 2
							ItemSpacing: 2
						Button@CHAT_MODE:
							Y: PARENT_HEIGHT - HEIGHT
							Width: 50
							Height: 25
							Text: button-lobbychat-chat-mode.label
							Font: Bold
							Key: ToggleChatMode
							TooltipText: button-lobbychat-chat-mode.tooltip
							TooltipContainer: TOOLTIP_CONTAINER
						TextField@CHAT_TEXTFIELD:
							X: 55
							Y: PARENT_HEIGHT - HEIGHT
							Width: PARENT_WIDTH - 260 - 55
							Height: 25
				Button@START_GAME_BUTTON:
					Background: cc-mp-control
					X: PARENT_WIDTH - WIDTH - 150
					Y: PARENT_HEIGHT - HEIGHT - 20
					Width: 120
					Height: 25
					Text: button-server-lobby-start-game
					Font: Bold
				Button@DISCONNECT_BUTTON:
					Background: cc-mp-control
					X: PARENT_WIDTH - WIDTH - 20
					Y: PARENT_HEIGHT - HEIGHT - 20
					Width: 120
					Height: 25
					Text: button-server-lobby-disconnect
					Font: Bold
				Container@FACTION_DROPDOWN_PANEL_ROOT:
				TooltipContainer@TOOLTIP_CONTAINER:
