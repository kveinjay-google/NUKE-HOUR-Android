StretchBackground@MAPCHOOSER_PANEL:
	Background: cc-mp-map-background
	PreserveAspectRatio: False
	ClickThrough: False
	Logic: MapChooserLogic
	Width: WINDOW_WIDTH
	Height: WINDOW_HEIGHT
	Children:
		Container@MAPCHOOSER_CONTENT:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			Children:
				Label@MAPCHOOSER_TITLE:
					Y: 17
					Align: Center
					Width: PARENT_WIDTH
					Height: 20
					Text: label-mapchooser-panel-title
					Font: Bold
				Button@SYSTEM_MAPS_TAB_BUTTON:
					X: 20
					Y: 48
					Height: 31
					Width: 140
					Text: button-mapchooser-panel-system-maps-tab
					Font: Bold
				Button@REMOTE_MAPS_TAB_BUTTON:
					X: 20
					Y: 48
					Height: 31
					Width: 140
					Text: button-mapchooser-panel-remote-maps-tab
					Font: Bold
				Button@USER_MAPS_TAB_BUTTON:
					X: 160
					Y: 48
					Height: 31
					Width: 140
					Text: button-mapchooser-panel-third-party-maps-tab
					Font: Bold
				Container@MAP_TAB_PANES:
					Width: PARENT_WIDTH - 40
					Height: 438
					X: 20
					Y: 77
					Children:
						Container@SYSTEM_MAPS_TAB:
							Width: PARENT_WIDTH
							Height: PARENT_HEIGHT
							Children:
								ScrollPanel@MAP_LIST:
									Width: PARENT_WIDTH
									Height: PARENT_HEIGHT
						Container@REMOTE_MAPS_TAB:
							Width: PARENT_WIDTH
							Height: PARENT_HEIGHT
							Children:
								ScrollPanel@MAP_LIST:
									Width: PARENT_WIDTH
									Height: PARENT_HEIGHT
						Container@USER_MAPS_TAB:
							Width: PARENT_WIDTH
							Height: PARENT_HEIGHT
							Children:
								ScrollPanel@MAP_LIST:
									Width: PARENT_WIDTH
									Height: PARENT_HEIGHT
				ScrollItem@MAP_TEMPLATE:
					Width: 208
					Height: 242
					X: 0
					Visible: false
					EnableChildMouseOver: True
					Children:
						MapPreview@PREVIEW:
							X: (PARENT_WIDTH - WIDTH) / 2
							Y: 8
							Width: 186
							Height: 186
							IgnoreMouseOver: true
							IgnoreMouseInput: true
						LabelWithTooltip@DETAILS:
							Width: PARENT_WIDTH - 16
							Height: 24
							X: 8
							Y: PARENT_HEIGHT - HEIGHT - 8
							Align: Center
							Font: Bold
							TooltipContainer: TOOLTIP_CONTAINER
							TooltipTemplate: SIMPLE_TOOLTIP
				Container@FILTER_ORDER_CONTROLS:
					X: 20
					Y: PARENT_HEIGHT - 80
					Width: PARENT_WIDTH - 40
					Height: PARENT_HEIGHT
					Children:
						Label@FILTER_DESC:
							Width: 40
							Height: 24
							Font: Bold
							Align: Right
							Text: label-filter-order-controls-desc
						DropDownButton@MAP_CATEGORY_FILTER:
							X: 45
							Width: 150
							Height: 25
						Label@FILTER_DESC_JOINER:
							X: 195
							Width: 30
							Height: 24
							Font: Bold
							Align: Center
							Text: label-filter-order-controls-desc-joiner
						DropDownButton@GAMEMODE_FILTER:
							X: 225
							Width: 200
							Height: 25
						Label@ORDERBY_LABEL:
							X: PARENT_WIDTH - WIDTH - 200 - 5
							Width: 100
							Height: 24
							Font: Bold
							Align: Right
							Text: label-filter-order-controls-orderby
						DropDownButton@ORDERBY:
							X: PARENT_WIDTH - WIDTH
							Width: 200
							Height: 25
				Button@RANDOMMAP_BUTTON:
					Background: cc-mp-control
					X: 20
					Y: PARENT_HEIGHT - 45
					Width: 120
					Height: 25
					Text: button-mapchooser-panel-randommap
					Font: Bold
				Button@DELETE_MAP_BUTTON:
					X: 160
					Y: PARENT_HEIGHT - 45
					Width: 120
					Height: 25
					Text: button-mapchooser-panel-delete-map
					Font: Bold
				Button@DELETE_ALL_MAPS_BUTTON:
					X: 300
					Y: PARENT_HEIGHT - 45
					Width: 120
					Height: 25
					Text: button-mapchooser-panel-delete-all-maps
					Font: Bold
				Label@REMOTE_MAP_LABEL:
					X: 140
					Y: PARENT_HEIGHT - HEIGHT - 20
					Width: PARENT_WIDTH - 410
					Height: 25
					Align: Center
					Font: Bold
				Button@BUTTON_OK:
					Background: cc-mp-control
					X: PARENT_WIDTH - 270
					Y: PARENT_HEIGHT - 45
					Width: 120
					Height: 25
					Text: button-mapchooser-panel-ok
					Font: Bold
					Key: return
				Button@BUTTON_CANCEL:
					Background: cc-mp-control
					X: PARENT_WIDTH - 140
					Y: PARENT_HEIGHT - 45
					Width: 120
					Height: 25
					Text: button-back
					Font: Bold
					Key: escape
				Background@SELECTED_MAP_PANEL:
					Background: cc-mp-surface
					Children:
						MapPreview@SELECTED_MAP_PREVIEW:
							IgnoreMouseInput: True
						LabelWithTooltip@SELECTED_MAP_TITLE:
							Font: Bold
							Align: Center
							TooltipContainer: TOOLTIP_CONTAINER
							TooltipTemplate: SIMPLE_TOOLTIP
						LabelWithTooltip@SELECTED_MAP_DETAILS:
							Align: Center
							TooltipContainer: TOOLTIP_CONTAINER
							TooltipTemplate: SIMPLE_TOOLTIP
						LabelWithTooltip@SELECTED_MAP_AUTHOR:
							Align: Center
							TooltipContainer: TOOLTIP_CONTAINER
							TooltipTemplate: SIMPLE_TOOLTIP
				TooltipContainer@TOOLTIP_CONTAINER:
