Container@AI_PANEL:
	Logic: AiDifficultySettingsLogic
	Width: PARENT_WIDTH
	Height: PARENT_HEIGHT
	Children:
		ScrollPanel@SETTINGS_SCROLLPANEL:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			CollapseHiddenChildren: True
			TopBottomSpacing: 8
			ItemSpacing: 10
			Children:
				Container@AI_STATUS_ROW:
					Width: PARENT_WIDTH - 24
					Height: 40
					Children:
						Label@AI_STATUS:
							X: 12
							Y: 4
							Width: PARENT_WIDTH - 24
							Height: 26
							Text: ai-settings-official
							Font: Regular
				Container@AI_BONUSES_ROW:
					Width: PARENT_WIDTH - 24
					Height: 40
					Children:
						Label@AI_BONUSES:
							X: 12
							Y: 4
							Width: PARENT_WIDTH - 24
							Height: 26
							Text: ai-settings-bonuses-static
							Font: Regular
				Container@AI_NOTE_ROW:
					Width: PARENT_WIDTH - 24
					Height: 52
					Children:
						Label@AI_NOTE:
							X: 12
							Y: 4
							Width: PARENT_WIDTH - 24
							Height: 26
							Text: ai-settings-next-game
							Font: Regular
				Container@AI_PRESET_ROW:
					Width: PARENT_WIDTH - 24
					Height: 86
					Children:
						Label@AI_PRESET_LABEL:
							X: 12
							Y: 4
							Width: PARENT_WIDTH - 24
							Height: 26
							Text: ai-settings-preset
							Font: Regular
						DropDownButton@AI_PRESET:
							X: 12
							Y: 34
							Width: PARENT_WIDTH - 24
							Height: 44
							Font: Bold
				Container@AI_CREATE_ROW:
					Width: PARENT_WIDTH - 24
					Height: 56
					Children:
						Button@AI_CREATE:
							X: 12
							Y: 4
							Width: PARENT_WIDTH - 24
							Height: 44
							Text: ai-settings-create
							Font: Bold
				Container@AI_EDIT_ROW:
					Width: PARENT_WIDTH - 24
					Height: 56
					Children:
						Button@AI_EDIT:
							X: 12
							Y: 4
							Width: PARENT_WIDTH - 24
							Height: 44
							Text: ai-settings-edit
							Font: Bold
				Container@AI_DELETE_ROW:
					Width: PARENT_WIDTH - 24
					Height: 56
					Children:
