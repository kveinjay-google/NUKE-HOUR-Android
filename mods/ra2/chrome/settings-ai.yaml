							X: 12
							Y: 4
							Width: PARENT_WIDTH - 24
							Height: 26
							Text: ai-settings-name
							Font: Regular
						TextField@AI_NAME:
							X: 12
							Y: 34
							Width: PARENT_WIDTH - 24
							Height: 44
							MaxLength: 24
				Container@AI_STYLE_ROW:
					Width: PARENT_WIDTH - 24
