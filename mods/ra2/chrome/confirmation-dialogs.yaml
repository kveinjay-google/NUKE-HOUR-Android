StretchBackground@THREEBUTTON_PROMPT:
	Logic: IosTouchDialogLogic
	Background: cc-ingame-confirmation
	PreserveAspectRatio: false
	ClickThrough: false
	X: (WINDOW_WIDTH - WIDTH) / 2
	Y: (WINDOW_HEIGHT - HEIGHT) / 2
	Width: 780
	Height: 266
	Children:
		Label@PROMPT_TITLE:
			Width: PARENT_WIDTH
			Y: 68
			Height: 42
			Font: SettingsTitle
			Align: Center
		Label@PROMPT_TEXT:
			X: 80
			Y: 120
			Width: PARENT_WIDTH - 160
			Height: 54
			Font: SettingsRegular
			WordWrap: true
			Align: Center
		Button@CONFIRM_BUTTON:
			Background: cc-mp-control
			X: 75
			Y: PARENT_HEIGHT - 130
			Width: 200
			Height: 52
			Text: button-prompt-confirm
			Font: SettingsBold
			Key: return
			Visible: false
		Button@OTHER_BUTTON:
			Background: cc-mp-control
			X: (PARENT_WIDTH - WIDTH) / 2
			Y: PARENT_HEIGHT - 130
			Width: 200
			Height: 52
			Text: button-prompt-other
			Font: SettingsBold
			Visible: false
		Button@CANCEL_BUTTON:
			Background: cc-mp-control
			X: PARENT_WIDTH - WIDTH - 75
			Y: PARENT_HEIGHT - 130
			Width: 200
			Height: 52
			Text: button-cancel
			Font: SettingsBold
			Key: escape
			Visible: false

