<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NUKE HOUR · 从电脑导入</title><style>body{margin:0;background:#141719;color:#eef0ef;font:16px system-ui}main{max-width:780px;margin:5vh auto;padding:28px}h1{font-size:28px}p{color:#bbc2c5;line-height:1.7}section{border:1px solid #465055;padding:22px;margin:20px 0}button,input{font:inherit;padding:12px;margin:6px 8px 6px 0}button{background:#daaa53;border:0;color:#151515;cursor:pointer}button:disabled{opacity:.4}input{max-width:90%}progress{width:100%;height:24px}#status{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#bbb}</style><main><h1>NUKE HOUR · 从电脑导入</h1><p>文件直接传到同一 Wi-Fi 下的手机，不经过官网服务器。请保持手机停留在接收页面、屏幕亮起。</p><section id="transfer" hidden><label>选择正版游戏文件夹<br><input id="folder" type="file" webkitdirectory multiple></label><br><label>或选择多个资源文件<br><input id="files" type="file" multiple></label><p id="selection">尚未选择文件</p><button id="upload" disabled>上传 / 继续上传</button><button id="commit" disabled>开始导入</button><progress id="progress" max="1" value="0"></progress><p id="status" role="status" aria-live="polite">等待选择文件</p><small>第一版支持最多 64 个文件、总计 8 GiB。只传输游戏数据文件，自动跳过程序、系统元数据。中断后，在本次手机接收会话中重新选择相同文件并点击继续上传。</small></section><p id="error" role="alert"></p></main><script>
const $=id=>document.getElementById(id);let token=location.hash.slice(1),selected=[],busy=false,poll;
const allowed=/\.(mix|aud|bag|idx|map|mpr|oramap|wav|yrm|zip)$/i;
function failure(e){$('error').textContent=e.message||String(e);}
async function api(path,method='GET',body=null){const r=await fetch(path,{method,body,headers:token?{'X-Import-Token':token}:{},signal:AbortSignal.timeout(35000)});const data=await r.json();if(!r.ok||data.error)throw Error(data.error||'连接失败');return data;}
async function connect(){try{if(!/^[a-f0-9]{64}$/.test(token))throw Error('请在手机上点击“复制网址”，并在电脑浏览器打开完整链接。');await api('/status');$('transfer').hidden=false;}catch(e){failure(e);}}
connect();
function choose(event){if(busy)return;selected=[...event.target.files].filter(f=>allowed.test(f.name)&&!f.name.startsWith('.'));const names=new Set();for(const f of selected){const name=f.name.toLowerCase();if(names.has(name)){selected=[];failure(Error('存在同名资源文件，请选择单个游戏目录。'));break;}names.add(name);}const size=selected.reduce((n,f)=>n+f.size,0);$('selection').textContent=`${selected.length} 个资源文件 · ${(size/1048576).toFixed(1)} MiB`;$('upload').disabled=!selected.length||selected.length>64||size>8*1024**3;$('commit').disabled=true;}
$('folder').onchange=choose;$('files').onchange=choose;
function chunk(file,offset,onProgress){return new Promise((resolve,reject)=>{const x=new XMLHttpRequest();x.open('PUT','/chunk?'+new URLSearchParams({name:file.name,offset}));x.setRequestHeader('X-Import-Token',token);x.timeout=35000;x.upload.onprogress=e=>onProgress(e.loaded);x.onerror=()=>reject(Error('连接中断，请保持手机亮屏，恢复后点击继续上传。'));x.ontimeout=x.onerror;x.onload=()=>{try{const d=JSON.parse(x.responseText);if(x.status!==200||d.error)throw Error(d.error||'上传失败');resolve(d.offset);}catch(e){reject(e);}};x.send(file.slice(offset,offset+4*1024*1024));});}
$('upload').onclick=async()=>{busy=true;$('upload').disabled=true;$('folder').disabled=$('files').disabled=true;$('error').textContent='';let done=0,sent=0;const total=selected.reduce((n,f)=>n+f.size,0),start=performance.now();try{for(const f of selected){let offset=(await api('/file?'+new URLSearchParams({name:f.name,size:f.size,modified:f.lastModified}),'POST')).offset;done+=offset;while(offset<f.size){const previous=offset;offset=await chunk(f,offset,loaded=>{const seconds=(performance.now()-start)/1000,rate=(sent+loaded)/Math.max(.1,seconds),current=done+loaded;$('progress').value=current/total;$('status').textContent=`上传 ${Math.min(100,current/total*100).toFixed(1)}% · ${(current/1048576).toFixed(1)} / ${(total/1048576).toFixed(1)} MiB\n${f.name}\n${(rate/1048576).toFixed(1)} MiB/s · ${seconds>=1?'预计剩余 '+Math.ceil(Math.max(0,total-current)/rate)+' 秒':'正在估算时间…'}`;});done+=offset-previous;sent+=offset-previous;}}$('progress').value=1;$('status').textContent='上传完成，请点击“开始导入”。';$('commit').disabled=false;}catch(e){failure(e);}finally{busy=false;$('upload').disabled=false;$('folder').disabled=$('files').disabled=false;}};
$('commit').onclick=async()=>{try{await api('/commit','POST');$('commit').disabled=$('upload').disabled=true;$('status').textContent='手机正在校验并导入，请保持手机亮屏。';poll=setInterval(async()=>{try{const r=await api('/status');if(r.state==='complete'||r.state==='failed'){clearInterval(poll);$('status').textContent=r.state==='complete'?'导入成功，手机正在加载游戏。':'导入失败：'+r.message;}}catch(e){clearInterval(poll);failure(e);}},1500);}catch(e){failure(e);}};
</script></html>
