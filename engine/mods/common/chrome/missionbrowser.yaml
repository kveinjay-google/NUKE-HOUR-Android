Background@MISSIONBROWSER_PANEL:
	Logic: MissionBrowserLogic, IosTouchMenuLogic
	X: WINDOW_WIDTH / 20
	Y: WINDOW_HEIGHT / 20
	Width: WINDOW_WIDTH * 9 / 10
	Height: WINDOW_HEIGHT * 9 / 10
	Children:
		Label@MISSIONBROWSER_TITLE:
			Y: 12
			Width: PARENT_WIDTH
			Height: 30
			Text: label-missions-title
			Align: Center
			Font: Bold
		ScrollPanel@MISSION_LIST:
			X: 24
			Y: 54
			Width: PARENT_WIDTH * 2 / 5 - 34
			Height: PARENT_HEIGHT - 120
			Children:
				ScrollItem@HEADER:
					Background: scrollheader
					Width: PARENT_WIDTH - 27
					Height: 22
					X: 2
					Visible: false
					Children:
						Label@LABEL:
							Font: TinyBold
							Width: PARENT_WIDTH
							Height: 22
							Align: Center
				ScrollItem@TEMPLATE:
					Width: PARENT_WIDTH - 27
					Height: 42
					X: 2
					EnableChildMouseOver: True
					Children:
						LabelWithTooltip@TITLE:
							X: 10
							Width: PARENT_WIDTH - 112
							Height: 42
							TooltipContainer: TOOLTIP_CONTAINER
							TooltipTemplate: SIMPLE_TOOLTIP
						Label@STATUS:
							X: PARENT_WIDTH - 94
							Width: 80
							Height: 42
							Align: Right
							Font: TinyBold
		Container@MISSION_INFO:
			X: PARENT_WIDTH * 2 / 5
			Y: 54
			Width: PARENT_WIDTH * 3 / 5 - 24
			Height: PARENT_HEIGHT - 120
			Children:
				Background@MISSION_BG:
					Width: PARENT_WIDTH
					Height: PARENT_HEIGHT * 3 / 5
					Background: dialog3
					Children:
						MapPreview@MISSION_PREVIEW:
							X: 1
							Y: 1
							Width: PARENT_WIDTH - 2
							Height: PARENT_HEIGHT - 2
							IgnoreMouseOver: True
							IgnoreMouseInput: True
							ShowSpawnPoints: False
				Container@MISSION_TABS:
					Width: PARENT_WIDTH
					Y: PARENT_HEIGHT - 36
					Children:
						Button@MISSIONINFO_TAB:
							Width: PARENT_WIDTH / 2
							Height: 36
							Font: Bold
							Text: button-missionbrowser-panel-mission-info
						Button@OPTIONS_TAB:
							X: PARENT_WIDTH / 2
							Width: PARENT_WIDTH / 2
							Height: 36
							Font: Bold
							Text: button-missionbrowser-panel-mission-options
				Container@MISSION_MINIFIED_OPTIONS:
					Width: PARENT_WIDTH
					Height: PARENT_HEIGHT
					Visible: False
					Children:
						LabelForInput@DIFFICULTY_DESC:
							Y: PARENT_HEIGHT - HEIGHT
							Width: 56
							Height: 25
							Align: Right
							Text: dropdown-missionbrowser-difficulty.label
							For: DIFFICULTY
						DropDownButton@DIFFICULTY:
							X: 61
							Y: PARENT_HEIGHT - HEIGHT
							Width: 135
							Height: 25
							Font: Regular
							Text: label-missionbrowser-normal-difficulty
							TooltipText: dropdown-missionbrowser-difficulty.description
							PanelRoot: MISSION_DROPDOWN_PANEL_ROOT
							TooltipContainer: TOOLTIP_CONTAINER
						LabelForInput@GAMESPEED_DESC:
							X: PARENT_WIDTH - WIDTH - 115
							Y: PARENT_HEIGHT - HEIGHT
							Width: 120
							Height: 25
							Align: Right
							Text: dropdown-missionbrowser-gamespeed
							For: GAMESPEED
						DropDownButton@GAMESPEED:
							X: PARENT_WIDTH - WIDTH
							Y: PARENT_HEIGHT - HEIGHT
							Width: 110
							Height: 25
							Font: Regular
							PanelRoot: MISSION_DROPDOWN_PANEL_ROOT
							TooltipContainer: TOOLTIP_CONTAINER
				Container@MISSION_DETAIL:
					Y: PARENT_HEIGHT * 3 / 5 + 10
					Width: PARENT_WIDTH
					Height: PARENT_HEIGHT * 2 / 5 - 10
					Children:
						ScrollPanel@MISSION_DESCRIPTION_PANEL:
							Height: PARENT_HEIGHT - 36 # Fixed missions expand this at runtime after hiding the tabs.
							Width: PARENT_WIDTH
							TopBottomSpacing: 5
							Children:
								Label@MISSION_DESCRIPTION:
									X: 4
									Width: PARENT_WIDTH - 32
									VAlign: Top
									Font: Small
						ScrollPanel@MISSION_OPTIONS:
							Height: PARENT_HEIGHT - 36
							Width: PARENT_WIDTH
							TopBottomSpacing: 5
							Children:
								Container@CHECKBOX_ROW_TEMPLATE:
									Width: PARENT_WIDTH
									Height: 30
									Children:
										Checkbox@A:
											X: 10
											Width: PARENT_WIDTH / 2 - 25
											Height: 20
											Visible: False
											TooltipContainer: TOOLTIP_CONTAINER
										Checkbox@B:
											X: PARENT_WIDTH / 2 + 5
											Width: PARENT_WIDTH / 2 - 25
											Height: 20
											Visible: False
											TooltipContainer: TOOLTIP_CONTAINER
								Container@DROPDOWN_ROW_TEMPLATE:
									Height: 60
									Width: PARENT_WIDTH
									Children:
										LabelForInput@A_DESC:
											X: 10
											Width: PARENT_WIDTH / 2 - 35
											Height: 20
											Visible: False
											For: A
										DropDownButton@A:
											X: 10
											Width: PARENT_WIDTH / 2 - 35
											Y: 25
											Height: 25
											Visible: False
											PanelRoot: MISSION_DROPDOWN_PANEL_ROOT
											TooltipContainer: TOOLTIP_CONTAINER
										LabelForInput@B_DESC:
											X: PARENT_WIDTH / 2 + 5
											Width: PARENT_WIDTH / 2 - 35
											Height: 20
											Visible: False
											For: B
										DropDownButton@B:
											X: PARENT_WIDTH / 2 + 5
											Width: PARENT_WIDTH / 2 - 35
											Y: 25
											Height: 25
											Visible: False
											PanelRoot: MISSION_DROPDOWN_PANEL_ROOT
											TooltipContainer: TOOLTIP_CONTAINER
		Button@START_BRIEFING_VIDEO_BUTTON:
			X: 24
			Y: PARENT_HEIGHT - 52
			Width: 140
			Height: 34
			Text: button-missionbrowser-panel-start-briefing-video
			Font: Bold
		Button@STOP_BRIEFING_VIDEO_BUTTON:
			X: 24
			Y: PARENT_HEIGHT - 52
			Width: 140
			Height: 34
			Text: button-missionbrowser-panel-stop-briefing-video
			Font: Bold
		Button@START_INFO_VIDEO_BUTTON:
			X: 174
			Y: PARENT_HEIGHT - 52
			Width: 140
			Height: 34
			Text: button-missionbrowser-panel-start-info-video
			Font: Bold
		Button@STOP_INFO_VIDEO_BUTTON:
			X: 174
			Y: PARENT_HEIGHT - 52
			Width: 140
			Height: 34
			Text: button-missionbrowser-panel-stop-info-video
			Font: Bold
		Button@STARTGAME_BUTTON:
			X: PARENT_WIDTH - 310
			Y: PARENT_HEIGHT - 52
			Width: 140
			Height: 34
			Text: button-missionbrowser-panel-play
			Font: Bold
		Button@BACK_BUTTON:
			X: PARENT_WIDTH - 160
			Y: PARENT_HEIGHT - 52
			Width: 140
			Height: 34
			Text: button-back
			Font: Bold
			Key: escape
		Background@MISSION_BIN:
			X: 24
			Y: 54
			Width: PARENT_WIDTH - 48
			Height: PARENT_HEIGHT - 120
			Background: dialog3
			Children:
				VideoPlayer@MISSION_VIDEO:
					X: 1
					Y: 1
					Width: PARENT_WIDTH - 2
					Height: PARENT_HEIGHT - 2
		Container@MISSION_DROPDOWN_PANEL_ROOT:
		TooltipContainer@TOOLTIP_CONTAINER:

Background@FULLSCREEN_PLAYER:
	Width: WINDOW_WIDTH
	Height: WINDOW_HEIGHT
	Background: dialog5
	Visible: False
	Children:
		VideoPlayer@PLAYER:
			X: 0
			Y: 0
			Width: WINDOW_WIDTH
			Height: WINDOW_HEIGHT
